name: Prepare Protork Android sources
on:
  push:
    branches: [protork-theme-updater-20260922]
    paths: [.github/workflows/protork-directory-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check exact base and apply reviewed LAN patch
        env:
          PATCH_DATA: 
        run: |
          test "$(git rev-parse HEAD^)" = "a8218b7a5d3be87a5605d4ed8547542c82c4fca5"
          python3 -c 'import base64,gzip,os;open("/tmp/protork-directory.patch","wb").write(gzip.decompress(base64.b64decode(os.environ["PATCH_DATA"])))'
          git apply --check /tmp/protork-directory.patch
          git apply /tmp/protork-directory.patch
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test directory and signed provisioning
        run: node --test tools/protork-directory/directory.test.mjs tools/protork-directory/provision.test.mjs
      - name: Commit sources on the existing test branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src flutter tools/protork-directory
          git commit -m 'feat: initialize Android with Protork server and retain user consent'
          git push origin HEAD:protork-theme-updater-20260922
